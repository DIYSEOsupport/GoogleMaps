<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gumroad Thumbnail (Square)</title>
<style>
@import url('https://fonts.googleapis.com/css?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background:#0d1620; }
#downloadBtn {
  position: fixed; top: 16px; right: 16px; z-index: 10;
  background: #C08A2E; color: #fff; border: none; font-weight: 700;
  font-size: 14px; padding: 12px 22px; border-radius: 8px; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
#downloadBtn:hover { background: #a67526; }
</style>
</head>
<body>

<button id="downloadBtn">Download PNG</button>

<div id="art" style="width:1000px;height:1000px;position:relative;overflow:hidden;background:radial-gradient(ellipse 800px 700px at 25% 15%,#375575 0%,transparent 60%),radial-gradient(ellipse 800px 700px at 80% 95%,#2f4b64 0%,transparent 60%),linear-gradient(160deg,#2c4459 0%,#1a2a38 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;">

  <div style="position:absolute;top:-200px;left:-160px;width:600px;height:600px;background:radial-gradient(circle,rgba(192,138,46,.30),rgba(192,138,46,.07) 55%,transparent 75%);"></div>
  <div style="position:absolute;bottom:-220px;right:-160px;width:640px;height:640px;background:radial-gradient(circle,rgba(91,130,102,.26),rgba(91,130,102,.06) 55%,transparent 75%);"></div>

  <div style="position:relative;z-index:2;">
    <div style="font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#E0AC5C;margin-bottom:20px;">No Budget. No Tech Skills.</div>
    <div style="width:64px;height:2px;background:#E0AC5C;margin:0 auto 30px;"></div>

    <h1 style="font-family:'Fraunces',serif;font-size:64px;font-weight:700;color:#fff;line-height:1.1;letter-spacing:-0.01em;margin-bottom:22px;">Get Found on<br><span style="color:#E0AC5C;">Google Maps</span></h1>

    <div style="font-size:19px;font-weight:400;color:#B7C4CE;line-height:1.55;max-width:640px;margin:0 auto 40px;">The DIY 15-minute checklist that fills in the gaps in your Google listing.</div>

    <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
      <span style="font-size:24px;line-height:1;color:#8494A0;text-decoration:line-through;font-weight:500;">$12</span>
      <span style="font-family:'Fraunces',serif;font-size:52px;line-height:1;font-weight:700;color:#fff;">$9</span>
      <span style="display:inline-block;font-size:13px;line-height:1;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#C08A2E;color:#fff;padding:9px 16px;border-radius:6px;">Limited Time</span>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
document.getElementById('downloadBtn').addEventListener('click', function () {
  html2canvas(document.getElementById('art'), { scale: 2, useCORS: true }).then(function (canvas) {
    var link = document.createElement('a');
    link.download = 'gumroad-thumbnail-square.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});
</script>
</body>
</html>
